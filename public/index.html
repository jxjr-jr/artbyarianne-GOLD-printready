<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Art by Arianne — Original paintings and fine art by Jas Rogers." />
  <meta name="theme-color" content="#F5F0EB" />
  <title>Art by Arianne</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
</head>
<body>

  <!-- ── Navigation ─────────────────────────────────────────── -->
  <header>
    <nav class="nav" role="navigation" aria-label="Main navigation">
      <div class="nav__inner">
        <a href="index.html" class="nav__logo">
          <img src="images/logo-rat.png" alt="Art by Arianne logo" class="nav__logo-img" />
          Art by Arianne
        </a>

        <!-- Desktop links -->
        <ul class="nav__links" role="list">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>

        <!-- Hamburger -->
        <button class="nav__burger" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobile-nav">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>
    </nav>

    <!-- Mobile menu -->
    <div class="nav__mobile" id="mobile-nav" role="dialog" aria-label="Mobile navigation">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </header>

  <!-- ── Hero ───────────────────────────────────────────────── -->
  <main class="page">
    <section class="hero">
      <h1 class="hero__title">Original Fine Art</h1>
      <p class="hero__sub">
        Paintings by Jas Rogers — expressive, intimate works.
      </p>
      <a href="gallery.html" class="btn">View the Gallery</a>
      <div class="hero__divider"></div>
    </section>

    <!-- Featured works strip -->
    <section class="home-strip" aria-label="Featured works">
      <div class="home-strip__grid">
        <a href="sketches.html" class="strip-card" aria-label="View He Do Scans">
          <img src="images/artwork-1.jpg" alt="He Do Scans — ink sketch of a person working at a desk" class="strip-card__img" loading="lazy" />
          <p class="strip-card__label">He Do Scans</p>
        </a>
        <a href="sketches.html" class="strip-card" aria-label="View Sit">
          <img src="images/artwork-4.jpg" alt="Sit — ink sketch of an artist painting from behind" class="strip-card__img" loading="lazy" />
          <p class="strip-card__label">Sit</p>
        </a>
        <a href="sketches.html" class="strip-card" aria-label="View Together">
          <img src="images/artwork-5.jpg" alt="Together — ink sketch of two people sitting under a hanging plant" class="strip-card__img" loading="lazy" />
          <p class="strip-card__label">Together</p>
        </a>
      </div>
    </section>
  </main>

  <!-- ── Footer ─────────────────────────────────────────────── -->
  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__copy">&copy; 2028 Art by Arianne &mdash; Jas</p>
      <nav class="footer__links" aria-label="Footer navigation">
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
